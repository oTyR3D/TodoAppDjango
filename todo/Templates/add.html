<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Adicionar Nova Tarefa</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-r from-green-100 to-blue-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white w-full max-w-md p-6 rounded-2xl shadow-2xl">
        <h1 class="text-2xl font-bold text-center text-green-600 mb-6">📝 Nova Tarefa</h1>

        <form method="POST" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-gray-700 font-medium mb-1">Título</label>
                <input type="text" name="title" placeholder="Digite a tarefa..." class="w-full p-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-green-400">
            </div>

            <div class="flex justify-between">
                <button type="submit" class="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded-full transition">
                    ➕ Adicionar
                </button>
                <a href="{% url 'home' %}" class="bg-gray-300 hover:bg-gray-400 text-gray-700 px-4 py-2 rounded-full transition">
                    ❌ Cancelar
                </a>
            </div>
        </form>
    </div>

</body>
</html>
