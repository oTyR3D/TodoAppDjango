<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Editar Tarefa</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4">

    <h1 class="text-2xl font-bold mb-4">Editar Tarefa</h1>

    <form method="POST" class="bg-white p-4 rounded shadow space-y-2">
        {% csrf_token %}
        <input type="text" name="title" value="{{ todo.title }}" class="border p-2 w-full rounded">
        <button type="submit" class="bg-green-500 text-white px-4 py-2 rounded">Salvar</button>
        <a href="{% url 'home' %}" class="text-gray-500 ml-2">Cancelar</a>
    </form>

</body>
</html>
