<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Minha Lista de Tarefas</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-r from-green-100 to-blue-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white w-full max-w-xl p-6 rounded-2xl shadow-2xl">
        <h1 class="text-3xl font-extrabold text-center text-green-700 mb-6">📋 Minha Lista de Tarefas</h1>

        <div class="flex justify-center mb-4">
            <a href="{% url 'add_todo' %}" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-full transition">+ Nova Tarefa</a>
        </div>

        <ul class="space-y-3">
            {% for todo in todos %}
            <li class="flex items-center justify-between bg-gray-100 p-4 rounded-xl shadow-sm hover:bg-gray-200 transition">
                <div class="flex items-center space-x-3">
                    {% if todo.completed %}
                        <span class="text-green-600 text-xl">✅</span>
                        <s class="text-gray-500">{{ todo.title }}</s>
                    {% else %}
                        <span class="text-yellow-500 text-xl">🕒</span>
                        <span>{{ todo.title }}</span>
                    {% endif %}
                </div>
                <div class="flex space-x-2">
                    <a href="{% url 'toggle_complete' todo.id %}" class="text-sm px-3 py-1 bg-yellow-400 hover:bg-yellow-500 text-white rounded-full transition">
                        {% if todo.completed %}Desfazer{% else %}Concluir{% endif %}
                    </a>
                    <a href="{% url 'edit_todo' todo.id %}" class="text-sm px-3 py-1 bg-blue-500 hover:bg-blue-600 text-white rounded-full transition">Editar</a>
                    <a href="{% url 'delete_todo' todo.id %}" class="text-sm px-3 py-1 bg-red-500 hover:bg-red-600 text-white rounded-full transition">Excluir</a>
                </div>
            </li>
            {% empty %}
                <li class="text-center text-gray-500">Nenhuma tarefa ainda.</li>
            {% endfor %}
        </ul>
    </div>

</body>
</html>
