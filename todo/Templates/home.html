<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Lista de Tarefas</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4">

    <h1 class="text-2xl font-bold mb-4">Minhas Tarefas</h1>

    <ul>
        {% for todo in todos %}
        <li class="bg-white p-3 mb-2 rounded shadow flex justify-between items-center">
            <span>{{ todo.title }}</span>
            <div class="space-x-2">
                <a href="{% url 'edit_todo' todo.id %}" class="bg-blue-500 text-white px-2 py-1 rounded">Editar</a>
                <a href="{% url 'delete_todo' todo.id %}" class="bg-red-500 text-white px-2 py-1 rounded">Excluir</a>
            </div>
        </li>
        {% endfor %}
    </ul>

</body>
</html>
